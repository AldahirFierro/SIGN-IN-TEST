<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <style>
            body{
                font-family: 'Segoe UI', Arial, sans-serif;
                margin: 0;
                display: grid;
                place-content: center;
                min-height: 100vh;
                padding: 20px;
                box-sizing: border-box;
            }

            body-after{
                content: "";
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: linear-gradient(to bottom, rgba(117, 0, 0, 0.253) 0%, transparent 50%, rgba(117, 0, 0, 0.253) 100%);
                z-index: -1;
                pointer-events: none; /*evota que interfiera con los clics en la pantalla */

            }

            #video-fondo{
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                object-fit: cover;
                z-index: -1;
            }

            .caja-principal{
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                

               width: 100%;
               max-width: 750px;
               min-height: 400px;
               overflow: hidden;

            }
            
            .caja-izquierda{
                background: linear-gradient(to bottom, rgba(117, 0, 0, 0.253) 0%, transparent 50%, rgba(117, 0, 0, 0.253) 100%);
                background-color: rgb(255, 74, 98);
                justify-content: center;
                align-content: center;
            }
            
            .contenido-texto{
                padding: 40px;
            }

            .caja-derecha{
                background: linear-gradient(to bottom, rgba(0, 0, 0, 0.253) 0%, transparent 50%, rgba(0,0,0,0.253) 100%);
                background-color: rgb(255, 255, 255);
                justify-content: center;
                align-content: center;

            }

            .texto-ingreso{
                padding:25%;
            }

            #hola{
                font-family: fantasy;
                display:block;
                width: 100%;
                text-align: left;
                font-size: 40px;
                margin-left: 40px ;
                margin-bottom: 5px;
                color: #fdfdfd;
                text-shadow: 1px 1px 10px #00000079;
                pointer-events: none;
                
            }

            #bienvenido{
                font-family: fantasy;
                color: #fdfdfd;
                display: block;
                width: 100%;
                text-align: center;
                font-size: 25px;
                
                text-shadow: 1px 1px 10px #00000079;
                pointer-events: none;

            }

            .caja-derecha input{
                border: none;
                border-radius: 8px;
                color: #fdfdfd;
                background-color: rgb(202, 202, 202);

                width: 110%;
                padding: 5px;
                box-sizing: border-box;
                font-size: 20px;
                outline: none;
            }
            .caja-derecha input-placeholder{
                    color: white; /* Inside text color */
                    border: 2px black; /* Width and color of the border */

            }
            .caja-derecha label{
                font-size: 22px;
                font-family: 'LEMON MILK', Courier, monospace
            }
        </style>
    </head>
<body>

    <video autoplay loop muted playsinline id="video-fondo">
        <source src="Yourname.mp4" type="video/mp4">
        tu navegador no soporta videos.
    </video>

    <div class="caja-principal">
        <div class="caja-izquierda">
            <div class="contenido-texto">
             <span id="hola">¡HOLA!</span>
             <span id="bienvenido">BIENVENIDO DE VUELTA </span>
            </div>
        </div>

        <div class="caja-derecha">
            <div class="texto-ingreso">
                <label for="usuario-tag">USUARIO</label>
                <input id="usuario-tag" name="usuario-tag" type="text" placeholder="Ingresa tu usuario">
                <label for="password-tag">CONTRASEÑA</label>
                <input  id="password-tag" name="password-tag" type="password" placeholder="Ingresa tu contraseña">
            </div>
        </div>
    </div>
    
</body>
</html>
